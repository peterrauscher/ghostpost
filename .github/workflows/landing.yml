name: landing

on:
  push:
    branches: [master]
    paths:
      - landing/**
      - app/assets/** # mascots, icons and the font are imported from the app
      - .github/workflows/landing.yml
  pull_request:
    paths:
      - landing/**
      - app/assets/**
      - .github/workflows/landing.yml
  workflow_dispatch:

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: landing

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run check
        env:
          PUBLIC_SITE_URL: https://getghostpost.com
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: landing-e2e
          path: landing/e2e/artifacts
          retention-days: 14

  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://getghostpost.com
    concurrency:
      group: landing-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      # Applies pending D1 migrations, builds, and uploads the Worker + static assets.
      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLIC_SITE_URL: https://getghostpost.com
