[package]
name = "scan-text"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[dependencies]
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-normalization = "0.1"
unicode-segmentation = "1"
uuid = { version = "1", features = ["serde"] }
base64 = "0.22"
