[package]
name = "scan-jev"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[dependencies]
async-trait = "0.1"
scan-text = { path = "../scan-text" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
parking_lot = "0.12"
